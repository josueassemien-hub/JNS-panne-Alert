<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord | JNS-panneAlert</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="simple-header">
    <h1>Tableau de bord - Administration</h1>
  </header>

  <section class="table-section">
    <h2>Liste des signalements</h2>
    <table id="adminTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Citoyen</th>
          <th>Description</th>
          <th>Localisation</th>
          <th>Statut</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <script src="script.js"></script>
</body>
</html>
