<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signaler une panne | JNS-panneAlert</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="simple-header">
    <h1>Signaler une panne électrique ⚡</h1>
  </header>

  <section class="form-section">
    <form id="signalForm" enctype="multipart/form-data">
      <label for="nom">Nom et prénom :</label>
      <input type="text" id="nom" required>

      <label for="telephone">Téléphone :</label>
      <input type="text" id="telephone" required>

      <label for="description">Description de la panne :</label>
      <textarea id="description" rows="3" required></textarea>

      <label for="photo">Photo de la panne :</label>
      <input type="file" id="photo" accept="image/*">

      <label for="localisation">Localisation :</label>
      <input type="text" id="localisation" readonly required>
      <button type="button" id="getLocation">Obtenir ma position</button>

      <button type="submit">Envoyer le signalement</button>
    </form>
  </section>

  <script src="script.js"></script>
</body>
</html>
